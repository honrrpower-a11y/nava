name: NAVI preview memory diagnostics

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/navi-preview-memory-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-preview-d1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Verify the isolated preview database target
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const db = (config.d1_databases || []).find(x => x.binding === 'NAVI_PREVIEW_DB');
          if (config.name !== 'nava-music-api' ||
              !db ||
              db.database_name !== 'nava-memory-preview' ||
              db.database_id !== 'b48b0390-f292-4ecf-b36d-31eb2aff3958') {
            throw new Error('Refusing to query: preview D1 target does not match the approved isolated database.');
          }
          console.log('Target verified: nava-memory-preview (isolated preview D1).');
          NODE

      - name: Run read-only memory diagnostics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)

          SQL="SELECT
            status,
            CASE
              WHEN instr(memory_value, 'قرمز') > 0 THEN 'red'
              WHEN instr(memory_value, 'آبی') > 0 OR instr(memory_value, 'ابی') > 0 THEN 'blue'
              ELSE 'other'
            END AS color_group,
            COUNT(*) AS record_count
          FROM navi_memory_facts_v1
          WHERE owner_id = 'owner'
            AND (
              memory_value LIKE '%رنگ%'
              OR memory_key LIKE '%رنگ%'
              OR memory_value LIKE '%قرمز%'
              OR memory_value LIKE '%آبی%'
              OR memory_value LIKE '%ابی%'
            )
          GROUP BY status, color_group
          ORDER BY status, color_group;"

          echo "Read-only query: counts only; no memory text, keys, or identifiers are printed."
          npx wrangler d1 execute nava-memory-preview --remote --command "$SQL" --config wrangler.jsonc
