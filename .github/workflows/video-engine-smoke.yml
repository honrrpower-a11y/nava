name: Video Engine Smoke

on:
  pull_request:
    paths:
      - "video-engine/**"
      - "video-studio.js"
      - "app.js"
      - "video-studio.css"
      - "index.html"
      - ".github/workflows/video-engine-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: Validate browser renderer and render video proofs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: ""

      - name: Validate browser renderer syntax
        run: |
          node --check video-studio.js
          node --check video-engine/depth-parallax.js

      # Regression coverage for the NAVI-only build flow.
      - name: Verify NAVI media controls and one-shot request wiring
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import assert from "node:assert/strict";
          const js = fs.readFileSync("video-studio.js", "utf8");
          const html = fs.readFileSync("index.html", "utf8");
          const app = fs.readFileSync("app.js", "utf8");
          const depth = fs.readFileSync("video-engine/depth-parallax.js", "utf8");
          const askHandlerCount = js.split('$("navaVideoAskNavi")').length - 1;
          assert.equal(askHandlerCount, 1, "NAVI build button must have exactly one click handler");
          assert.ok(js.includes('$("navaVideoNaviChoosePhotos")?.addEventListener("click",()=>imageInput?.click())'), "NAVI photo button must open the real image picker");
          assert.ok(js.includes('$("navaVideoNaviChooseMusic")?.addEventListener("click",()=>musicInput?.click())'), "NAVI music button must open the real music picker");
          assert.match(js, /selectedMedia:\{images:imageNames,music:musicInfo\}/, "NAVI context must include selected media metadata");
          assert.match(js, /window\.addEventListener\(["']nava:navi-reply["']/, "NAVI reply handler must be present");
          assert.match(js, /schema===["']nava\.video\.scene-plan\.v1["']/, "NAVI scene plan must be schema-validated");
          assert.match(js, /transition:\["cut","fade","slide-left","slide-right","zoom","page-turn"\]/, "NAVI must choose from supported scene transitions");
          assert.match(js, /depth-parallax/, "NAVI scene plans must support depth-aware photo motion");
          assert.match(js, /plan.scenes.length>20/, "NAVI scene plan must allow a separate page for each of up to 20 photos");
          assert.match(js, /pageTurnPlan&&plan\.scenes\.some\(scene=>scene\.layout!=="single"\|\|scene\.images\.length!==1\)/, "Any page-turn sequence must use one photo per scene");
          assert.match(js, /const t=\(i\+\.5\)\/strips;/, "Page-turn curl must draw the full page before folding it");
          assert.match(js, /activeStory\?\.transition==="page-turn"\?"single"/, "Page-turn scenes must render as a single photo page");
          assert.match(js, /allUsableImages.slice\(0,1\)/, "Page-turn scenes must not become multi-photo collages");
          assert.match(js, /requested.slice\(1\)/, "Depth inference must be limited to one photo per video for mobile performance");
          assert.match(js, /strips=48/, "Page-turn must use a curved sheet transition rather than a flat shrinking panel");
          assert.match(depth, /if\(!navigator\.gpu\)/, "Avoid CPU-heavy WASM depth inference on phones without WebGPU");
          assert.match(depth, /448\/Math.max/, "Depth inference must use a reduced-resolution input on mobile");
          assert.match(depth, /No oscillating X\/Y camera roll or orbit/, "Depth motion must not look like camera rotation");
          assert.match(js, /await prepareDepthMotion\(previewStory\)/, "Depth analysis must finish before preview starts");
          assert.match(js, /await prepareDepthMotion\(renderStory\)/, "Depth analysis must finish before final rendering");
          assert.match(js, /renderDepthParallax/, "Canvas renderer must composite the depth-parallax frame");
          assert.match(depth, /onnx-community\/depth-anything-v2-small/, "Depth engine must use the small on-device depth model");
          assert.match(depth, /device:"webgpu",dtype:"fp16"/, "Depth engine must prefer WebGPU when available");
          assert.doesNotMatch(depth, /device:"wasm",dtype:"q8"/, "Avoid CPU-heavy WASM depth inference on mobile devices");
          assert.match(js, /resolveLayerTextColor/, "Automatic text color must be contrast-checked against the selected image");
          assert.match(js, /transitionCurrentCanvas/, "Scene transitions must be composited in the actual canvas renderer");
          assert.match(js, /type:"page-turn"/, "Page-turn transition must schedule its own sound effect");
          assert.match(js, /scene\.transition==="page-turn"/, "Page-turn audio must be included in final render audio");
          assert.match(js, /buildNaviScenePlan\(reply\)/, "NAVI replies must be applied through the structured scene-plan executor");
          assert.match(js, /while\(storyCards\(\)\.length<plan\.scenes\.length\)/, "NAVI plan must dynamically create the requested scene cards");
          const replyStart = js.indexOf('window.addEventListener("nava:navi-reply"');
          const replyHandler = js.slice(replyStart, replyStart + 1400);
          assert.doesNotMatch(replyHandler, /applyBrief\(\)/, "NAVI output must not be interpreted by manual keyword rules");
          assert.match(js, /فقط یک شیء JSON معتبر/, "NAVI prompt must request machine-readable creative direction");
          assert.match(js, /naviPlanRetryCount<1/, "NAVI must get one chance to repair its own invalid plan");
          assert.match(js, /photoY بین 0\.16 و 0\.40/, "NAVI prompt must include renderer numeric bounds");
          const videoReplyStart = app.indexOf('if (selectedService === "ویدئو و صدا")');
          const videoReplyBlock = app.slice(videoReplyStart, app.indexOf("} else {", videoReplyStart));
          assert.match(videoReplyBlock, /showNaviReply\("طرح صحنه‌ها/, "Internal scene JSON must be replaced with a friendly status in chat");
          assert.doesNotMatch(videoReplyBlock, /showNaviReply\(reply\)/, "Raw scene JSON must never be shown as a user-facing NAVI reply");
          assert.match(app, /isInternalVideoPlan/, "Restored NAVI history must identify internal video plans");
          assert.match(app, /جزئیات طراحی به‌صورت داخلی پردازش شده است/, "Restored history must show a friendly status instead of raw scene JSON");
          assert.match(app, /nava\.video\.scene-plan\.v1/, "Chat-level video instruction must require the same structured schema");
          assert.match(js, /if\(applied\)setTimeout\(\(\)=>\{if\(!renderBtn\.disabled\)renderBtn\.click\(\)/, "Valid NAVI scene plans must trigger automatic render");
          for (const id of ["navaVideoNaviChoosePhotos", "navaVideoNaviChooseMusic", "navaVideoBrief", "navaVideoAskNavi"]) {
            assert.ok(html.includes('id="' + id + '"'), "Missing NAVI UI control: " + id);
          }
          assert.ok(html.includes('data-layer-reveal'), "Manual editor must expose per-layer text reveal modes");
          assert.ok(html.includes('data-layer-sound'), "Manual editor must expose per-layer sound effects");
          assert.match(js, /revealMode==="word"\?body\.split/, "Renderer must reveal text word by word");
          assert.match(js, /scheduleSoundEffects\(story,previewMasterGain,[^;]*previewOffset/, "Preview sound effects must use the shared muteable audio bus and selected scene offset");
          assert.match(js, /musicGain\.connect\(previewMasterGain\)/, "Preview music must use the shared muteable audio bus");
          assert.match(js, /previewMasterGain\.gain\.setValueAtTime\(previewMuted\?0:1/, "Preview mute state must be applied to music and effects");
          assert.match(js, /navaVideoPreviewMute/, "Preview UI must expose a mute toggle");
          assert.match(js, /await musicElement\.play\(\)/, "Preview must start the selected music track");
          assert.match(js, /const soundEvents=\[\];let soundCursor=0/, "Final render must collect per-scene sound events");
          assert.match(js, /audioBuffer=audioContext\.createBuffer\(2,frameCount,sampleRate\)/, "Sound-only projects must still create an audio track");
          assert.match(app, /reveal را از بین none\/word\/char و sound را از بین none\/type\/impact\/whoosh\/sparkle/, "NAVI must be instructed to choose text reveal and sound effects");
          console.log("NAVI media flow, text reveal, procedural sound effects, preview and render wiring verified.");
          NODE

      - name: Ensure FFmpeg is available
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo timeout 600s apt-get update -qq
            sudo timeout 600s apt-get install -y --no-install-recommends ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version
          ffprobe -version

      - name: Download the photographic input
        run: |
          mkdir -p video-engine/image-motion-demo/assets
          curl --retry 3 --fail --location --silent --show-error \
            "https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=1600&h=2844&fit=crop&crop=entropy&auto=format&q=88" \
            -o video-engine/image-motion-demo/assets/landscape.jpg
          test -s video-engine/image-motion-demo/assets/landscape.jpg
          file video-engine/image-motion-demo/assets/landscape.jpg

      - name: Validate text composition
        working-directory: video-engine/demo
        run: npx --yes hyperframes@0.9.72 lint

      - name: Render text composition
        working-directory: video-engine/demo
        run: npx --yes hyperframes@0.9.72 render --output nava-first-render.mp4 --fps 30 --quality draft --workers 1

      - name: Validate image composition
        working-directory: video-engine/image-motion-demo
        run: npx --yes hyperframes@0.9.72 lint

      - name: Render image-to-motion composition
        working-directory: video-engine/image-motion-demo
        run: npx --yes hyperframes@0.9.72 render --output nava-image-motion.mp4 --fps 30 --quality draft --workers 1

      - name: Verify both MP4 outputs
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { execFileSync } from "node:child_process";
          const files = [
            ["video-engine/demo/nava-first-render.mp4", "text composition"],
            ["video-engine/image-motion-demo/nava-image-motion.mp4", "image motion composition"]
          ];
          for (const [path, label] of files) {
            const raw = execFileSync("ffprobe", [
              "-v", "error", "-select_streams", "v:0",
              "-show_entries", "stream=codec_name,width,height",
              "-show_entries", "format=duration", "-of", "json", path
            ], { encoding: "utf8" });
            const data = JSON.parse(raw);
            const stream = data.streams?.[0];
            const duration = Number(data.format?.duration);
            if (!stream || stream.codec_name !== "h264") throw new Error(label + ": expected H.264.");
            if (stream.width !== 1080 || stream.height !== 1920) throw new Error(label + ": unexpected dimensions.");
            if (!Number.isFinite(duration) || duration < 7.5 || duration > 8.5) throw new Error(label + ": unexpected duration " + duration);
            if (fs.statSync(path).size < 50000) throw new Error(label + ": output is unexpectedly small.");
            console.log("Validated " + label + ": H.264 1080x1920, " + duration.toFixed(2) + "s");
          }
          NODE

      - name: Upload rendered MP4s
        uses: actions/upload-artifact@v4
        with:
          name: nava-video-engine-smoke
          path: |
            video-engine/demo/nava-first-render.mp4
            video-engine/image-motion-demo/nava-image-motion.mp4
          if-no-files-found: error
          retention-days: 7
