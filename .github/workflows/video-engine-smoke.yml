name: Video Engine Smoke

on:
  pull_request:
    paths:
      - "video-engine/**"
      - "video-studio.js"
      - "app.js"
      - "video-studio.css"
      - "index.html"
      - ".github/workflows/video-engine-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: Validate browser renderer and render video proofs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: ""

      - name: Validate browser renderer syntax
        run: |
          node --check video-studio.js
          node --check video-engine/depth-parallax.js

      # Regression coverage for the NAVI-only build flow.
      - name: Verify NAVI media controls and one-shot request wiring
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import assert from "node:assert/strict";
          const js = fs.readFileSync("video-studio.js", "utf8");
          const html = fs.readFileSync("index.html", "utf8");
          const app = fs.readFileSync("app.js", "utf8");
          const depth = fs.readFileSync("video-engine/depth-parallax.js", "utf8");
          const askHandlerCount = js.split('$("navaVideoAskNavi")').length - 1;
          assert.equal(askHandlerCount, 1, "NAVI build button must have exactly one click handler");
          assert.ok(js.includes('$("navaVideoNaviChoosePhotos")?.addEventListener("click",()=>imageInput?.click())'), "NAVI photo button must open the real image picker");
          assert.ok(js.includes('$("navaVideoNaviChooseMusic")?.addEventListener("click",()=>musicInput?.click())'), "NAVI music button must open the real music picker");
          assert.match(js, /selectedMedia:\{images:imageNames,music:musicInfo\}/, "NAVI context must include selected media metadata");
          assert.match(js, /window\.addEventListener\(["']nava:navi-reply["']/, "NAVI reply handler must be present");
          assert.match(js, /schema===["']nava\.video\.scene-plan\.v1["']/, "NAVI scene plan must be schema-validated");
          assert.match(js, /transition:\["cut","fade","slide-left","slide-right","zoom","page-turn"\]/, "NAVI must choose from supported scene transitions");
          assert.match(js, /depth-parallax/, "NAVI scene plans must support depth-aware photo motion");
          assert.match(js, /function drawNaviArtDirection\(style,accent,sceneIndex,elapsed,duration\)/, "NAVI visual direction must be rendered as actual canvas graphics, not returned as recommendations");
          assert.match(js, /artDirection:\["none","cinematic","editorial","poster","luxury","tech","organic","documentary","minimal"\]/, "Scene plans must expose distinct executable art directions");
          assert.match(js, /photoTreatment:\["natural","cinematic","monochrome","warm","cool","vivid","muted"\]/, "Scene plans must expose executable photo treatments");
          assert.match(js, /drawNaviArtDirection\(activeStory\.artDirection\|\|"none"/, "Per-scene NAVI art direction must be applied during actual rendering");
          assert.match(js, /grayscale\(1\) contrast\(1\.08\)/, "Photo treatment must alter source image rendering, not only scene metadata");
          assert.match(js, /card\.dataset\.naviArtDirection=allowed\.artDirection\.includes\(scene\.artDirection\)/, "NAVI-selected art direction must survive scene-plan application");
          assert.match(js, /کارگردانی هنری باید در خود تصویر خروجی دیده شود/, "NAVI must make visual design decisions, not merely change captions");
          assert.match(js, /if\(!userBrief&&!scenes\.length\)/, "NAVI video build must work without a written brief when photos are supplied");
          assert.match(js, /اگر بریف خالی است، خودت با دیدن عکس‌ها/, "NAVI must autonomously invent the concept and copy when the user leaves the brief blank");
          assert.match(html, /توضیح یا ایده دلخواه \(اختیاری\)/, "The video brief must be presented as optional");
          assert.match(app, /artDirection، photoTreatment، accentColor/, "Authenticated video planning context must require executable visual direction");
          assert.match(js, /plan.scenes.length>20/, "NAVI scene plan must allow a separate page for each of up to 20 photos");
          assert.match(js, /scene\.transition==="page-turn"&&\(scene\.layout!=="single"\|\|scene\.images\.length!==1\)/, "Only the individual page-turn scene must use one photo");
          assert.doesNotMatch(js, /pageTurnPlan&&plan\.scenes\.some/, "A page-turn scene must not force every other scene into single-photo layout");
          assert.match(js, /کارگردانی چیدمان: برای هر صحنه مستقل تصمیم بگیر/, "NAVI prompt must explicitly choose varied layouts per scene");
          assert.match(js, /page-turn پیش‌فرض نیست و در کل پروژه حداکثر یک بار مجاز است/, "Page-turn must not dominate NAVI-generated videos");
          assert.match(js, /pageTurnCount>1/, "Reject a repeated page-turn slideshow instead of rendering a repetitive template");
          assert.match(js, /const t=\(i\+\.5\)\/strips;/, "Page-turn curl must draw the full page before folding it");
          assert.match(js, /activeStory\?\.transition==="page-turn"\?"single"/, "Page-turn scenes must render as a single photo page");
          assert.match(js, /allUsableImages.slice\(0,1\)/, "Page-turn scenes must not become multi-photo collages");
          assert.match(js, /requested.flatMap\(scene=>Array.isArray\(scene.imageIds\)\?scene.imageIds:\[\]\)/, "Depth inference must prepare the photos NAVI selected for depth motion");
          assert.match(js, /\.slice\(0,4\)/, "Depth inference must cap work at four photos per build for mobile performance");
          assert.doesNotMatch(js, /requested\.slice\(1\)/, "Depth motion must not silently downgrade every scene after the first");
          assert.doesNotMatch(js, /requestedLayout==="single"\?chooseAutoPhotoLayout/, "An explicit single-photo layout must not be replaced by an automatic collage");
          assert.match(js, /requestedMode==="depth-parallax"&&!sourceScene\?\.depthMap\?"slow-zoom":requestedMode/, "Unavailable depth must use a visible runtime fallback without mutating NAVI's plan");
          assert.match(js, /depth-parallax\|none/, "The canonical NAVI motion enum must include depth-parallax");
          assert.match(js, /strips=48/, "Page-turn must use a curved sheet transition rather than a flat shrinking panel");
          assert.match(depth, /if\(!navigator\.gpu\)/, "Avoid CPU-heavy WASM depth inference on phones without WebGPU");
          assert.match(depth, /448\/Math.max/, "Depth inference must use a reduced-resolution input on mobile");
          assert.match(depth, /No oscillating X\/Y camera roll or orbit/, "Depth motion must not look like camera rotation");
          assert.match(depth, /maxValue-minValue/, "Depth model values must be normalized to a visible 8-bit range");
          assert.match(depth, /strengthLocation,\.075/, "Depth parallax must have a visible displacement strength");
          assert.match(js, /await prepareDepthMotion\(previewStory\)/, "Depth analysis must finish before preview starts");
          assert.match(js, /await prepareDepthMotion\(renderStory\)/, "Depth analysis must finish before final rendering");
          assert.match(js, /renderDepthParallax/, "Canvas renderer must composite the depth-parallax frame");
          const recorderStartAt = js.indexOf("recorder.start(250);");
          const effectScheduleAt = js.indexOf("scheduleSoundEffects(renderStory,audioDestination,audioContext.currentTime+.18)", recorderStartAt);
          assert.ok(recorderStartAt >= 0 && effectScheduleAt > recorderStartAt, "Export sound effects must be scheduled only after MediaRecorder starts capturing");
          assert.doesNotMatch(js, /scheduleSoundEffects\(renderStory,audioDestination,audioContext\.currentTime\+\.08\)/, "Do not schedule opening effects before MediaRecorder starts");
          assert.match(depth, /onnx-community\/depth-anything-v2-small/, "Depth engine must use the small on-device depth model");
          assert.match(depth, /device:"webgpu",dtype:"fp16"/, "Depth engine must prefer WebGPU when available");
          assert.doesNotMatch(depth, /device:"wasm",dtype:"q8"/, "Avoid CPU-heavy WASM depth inference on mobile devices");
          assert.match(js, /return layer\.colorMode==="auto"\?"#fff4dc"/, "Automatic text color must never choose dark glyphs from a whole-image average");
          assert.match(js, /ctx\.strokeText\(text,x,y,maxWidth\);ctx\.fillText\(text,x,y,maxWidth\)/, "Automatic text must have a contrasting outline on mixed-lighting photos");
          assert.match(js, /transitionCurrentCanvas/, "Scene transitions must be composited in the actual canvas renderer");
          assert.match(js, /"page-turn":"page-turn","slide-left":"whoosh","slide-right":"whoosh",zoom:"impact",fade:"sparkle"/, "Page-turn and all other visual transitions must schedule their own sound effects");
          assert.match(js, /const hasEffects=story\.some\(scene=>\["cut","page-turn","slide-left","slide-right","zoom","fade"\]\.includes\(scene\.transition\)/, "Preview must activate its audio graph for every visual transition");
          assert.match(js, /const renderStorySounds=renderStory\.some\(scene=>\["cut","page-turn","slide-left","slide-right","zoom","fade"\]\.includes\(scene\.transition\)/, "Final render must create an audio track for every visual transition");
          assert.match(js, /if\(window\.Mediabunny&&\(naviExport\|\|!hasVisualTransitionAudio\|\|isLowPowerDevice\(\)\)\)/, "All NAVI exports must use deterministic offline rendering even when transitions include sound");
          assert.match(js, /const pageTurnCount=plan\.scenes\.filter\(scene=>scene\?\.transition==="page-turn"\)\.length/, "NAVI plans must not become repeated page-turn slideshows");
          assert.match(js, /page-turn پیش‌فرض نیست و در کل پروژه حداکثر یک بار مجاز است/, "NAVI must use page-turn sparingly and create project-specific visual direction");
          assert.match(js, /set\(node\.querySelector\("\[data-layer-color-mode\]"\),"auto",allowed\.colorMode\)/, "NAVI-generated text must start in automatic high-contrast mode");
          assert.match(js, /scheduleSoundEffects\(renderStory,audioDestination,audioContext\.currentTime\+\.18\)/, "Final render must capture the same scheduled transition effects as preview");
          assert.match(js, /previewStoryForLoop=previewStory;previewLoopIndex=0/, "Preview audio must retain the story and restart its sound effects on each visual loop");
          assert.match(js, /scheduleSoundEffects\(previewStoryForLoop,previewMasterGain,audioContext\.currentTime\+\.08,0\)/, "Preview loop must reschedule photo and text effects from the beginning");
          assert.match(js, /cut:"sparkle"/, "Even hard-cut photo changes must have an audible transition cue in preview and export");
          assert.match(js, /const deviceProfile=\(\(\)=>\{/, "Adaptive device profile must be initialized once");
          assert.match(js, /if\(isLowPowerDevice\(\)\)return landscape\?\[640,360\]:\[360,640\]/, "Low-power preview must use reduced dimensions");
          assert.match(js, /if\(isLowPowerDevice\(\)\)return landscape\?\[960,540\]:\[540,960\]/, "Low-power export must use a 540p canvas");
          assert.match(js, /if\(activeBuildMode\(\)==="navi"\)return landscape\?\[960,540\]:\[540,960\]/, "NAVI final export must use a 540p canvas without reducing preview quality");
          assert.match(js, /تحلیل سنگین عمق اجرا نشد/, "Low-power devices must skip heavy depth inference");
          assert.match(js, /lowPowerRender=isLowPowerDevice\(\)\|\|/, "Low-power profile must retain adaptive export encoding");
          assert.match(js, /const renderFps=naviExport\?18:lowPowerRender\?20:/, "NAVI recorder export must use the smoother-device 18 fps profile");
          assert.match(js, /extension==="webm"&&!isLowPowerDevice\(\)/, "Low-power devices must not run the large FFmpeg WASM converter");
          assert.match(js, /if\(!isMp4\)\{\s*if\(lowPower\)return false;/, "Low-power devices must skip VP9 and heavy WASM conversion when AVC is unavailable");
          assert.match(js, /let fps=activeBuildMode\(\)==="navi"\?18:20/, "NAVI direct export must use 18 fps");
          assert.match(js, /if\(!isMp4&&lowPower\)[\s\S]*?fps=15[\s\S]*?bitrate:600000[\s\S]*?getFirstEncodableVideoCodec\(\["avc"\]/, "Low-power export must retry H.264 at 360p/12fps when 540p is rejected");
          assert.match(js, /new MB\.Quality\(\{bitrate:activeBuildMode\(\)==="navi"\?1500000:lowPower\?1200000:2200000\}\)/, "NAVI direct export must use a reduced bitrate");
          assert.match(js, /if\(!isMp4\)\{\s*if\(lowPower\)return false;/, "Low-power devices must not fall back to VP9 plus a heavy WASM transcode");
          assert.match(js, /const sampleRate=lowPower\?32000:48000/, "Low-power audio encoding must use a reduced sample rate");
          assert.match(js, /await videoSource\.add\(t,1\/fps,\{keyFrame:frame===0\}\)/, "Offline export must assign fixed timestamps to every encoded frame");
          assert.match(js, /hasAudioTrack=!!\(await checkInput\.getPrimaryAudioTrack\(\)\)/, "Recorder exports must be checked for a real audio track before delivery");
          assert.match(js, /برای جلوگیری از تحویل ویدئوی بی‌صدا/, "An export with a missing audio track must not be published");
          assert.match(js, /پروژه کاملاً متن‌محور/, "NAVI must support text-only video projects");
          assert.match(js, /const size=40,sample=document\.createElement\("canvas"\)/, "Image visual analysis must stay at a small local sampling size");
          assert.match(js, /کانون بصری تقریبی/, "NAVI must receive a visual focus estimate for each photo");
          assert.match(js, /فضای مناسب متن/, "NAVI must receive estimated quiet areas for typography placement");
          assert.match(js, /حرکت را از روی کانون و کادر انتخاب کن/, "NAVI director prompt must adapt camera motion to image composition");
          assert.match(js, /analyzeNaviVideoImages\(items\)/, "Every selected NAVI photo must be analyzed locally");
          assert.match(js, /nava-video-image-palette/, "Each photo's extracted color palette must be visible in the video studio");
          assert.match(js, /images:naviVisionImages/, "Compressed analyzed photos must be attached to the grouped NAVI request");
          assert.match(js, /حداکثر ۶ عکس/, "The NAVI image count must be bounded for mobile and request-size safety");
          assert.match(app, /images: options\.videoPlan === true \? visionImages : undefined/, "The authenticated NAVI request must forward the multi-image payload only for video plans");
          assert.match(app, /nava:navi-error/, "Video planning failures must clear the pending status instead of leaving the studio stuck");

          assert.match(js, /Math\.sin\(n\*12\.9898\).*?\.42/, "Page-turn paper rustle must be audible in the final audio mix");
          assert.match(js, /const transitionEvents=readyEvents\.filter\(event=>event\.source==="transition"\)/, "All visual transition effects must bypass the regular effects cap");
          assert.match(js, /const transitionEvents=soundEvents\.filter\(event=>event\.source==="transition"\)/, "Mediabunny export must retain every visual transition effect");
          assert.match(js, /"page-turn":"page-turn","slide-left":"whoosh","slide-right":"whoosh",zoom:"impact",fade:"sparkle"/, "Every visual transition must map to a matching sound cue in preview and export");
          assert.match(js, /buildNaviScenePlan\(reply\)/, "NAVI replies must be applied through the structured scene-plan executor");
          assert.match(js, /while\(storyCards\(\)\.length<plan\.scenes\.length\)/, "NAVI plan must dynamically create the requested scene cards");
          const replyStart = js.indexOf('window.addEventListener("nava:navi-reply"');
          const replyHandler = js.slice(replyStart, replyStart + 1400);
          assert.doesNotMatch(replyHandler, /applyBrief\(\)/, "NAVI output must not be interpreted by manual keyword rules");
          assert.match(js, /فقط یک شیء JSON معتبر/, "NAVI prompt must request machine-readable creative direction");
          assert.match(js, /naviPlanRetryCount<1/, "NAVI must get one chance to repair its own invalid plan");
          assert.match(js, /photoY بین 0\.16 و 0\.40/, "NAVI prompt must include renderer numeric bounds");
          const videoPlanDispatch = app.indexOf('if (options.videoPlan === true) {');
          const videoPlanBlock = app.slice(videoPlanDispatch, app.indexOf("    try {", videoPlanDispatch));
          assert.ok(videoPlanDispatch >= 0, "Only explicit video-plan requests may enter the scene-plan flow");
          assert.match(videoPlanBlock, /nava:navi-reply[\s\S]*videoPlan: true/, "Only explicit video-plan requests may dispatch a structured scene plan");
          assert.match(videoPlanBlock, /else\s*\{\s*showNaviReply\(reply\);/, "Ordinary NAVI chat must display its guidance reply directly");
          assert.match(js, /try\{applied=buildNaviScenePlan\(reply\);\}\s*catch\(error\)/, "Scene-plan application errors must be caught and surfaced");
          assert.match(js, /event\.detail\.status=doneStatus/, "Successful scene-plan application must update the user-facing NAVI status");
          assert.match(js, /event\.detail\.status=failedStatus/, "Failed scene-plan application must report a visible failure instead of appearing stuck");
          const explicitPlanOnlyBlock = videoPlanBlock.slice(0, videoPlanBlock.indexOf("    } else {"));
          assert.doesNotMatch(explicitPlanOnlyBlock, /showNaviReply\(reply\)/, "Raw scene JSON must never be shown as a user-facing NAVI reply");
          assert.match(app, /isInternalVideoPlan/, "Restored NAVI history must identify internal video plans");
          assert.match(app, /جزئیات طراحی به‌صورت داخلی پردازش شده است/, "Restored history must show a friendly status instead of raw scene JSON");
          assert.match(app, /nava\.video\.scene-plan\.v1/, "Chat-level video instruction must require the same structured schema");
          assert.match(js, /if\(applied\)\{[\s\S]*?renderBtn\.click\(\)/, "Valid NAVI scene plans must trigger automatic render");
          for (const id of ["navaVideoNaviChoosePhotos", "navaVideoNaviChooseMusic", "navaVideoBrief", "navaVideoAskNavi"]) {
            assert.ok(html.includes('id="' + id + '"'), "Missing NAVI UI control: " + id);
          }
          assert.ok(html.includes('data-layer-reveal'), "Manual editor must expose per-layer text reveal modes");
          assert.ok(html.includes('data-layer-sound'), "Manual editor must expose per-layer sound effects");
          assert.match(js, /revealMode==="word"\?body\.split/, "Renderer must reveal text word by word");
          assert.match(js, /scheduleSoundEffects\(story,previewMasterGain,[^;]*previewOffset/, "Preview sound effects must use the shared muteable audio bus and selected scene offset");
          assert.match(js, /musicGain\.connect\(previewMasterGain\)/, "Preview music must use the shared muteable audio bus");
          assert.match(js, /previewMasterGain\.gain\.setValueAtTime\(previewMuted\?0:1/, "Preview mute state must be applied to music and effects");
          assert.match(js, /navaVideoPreviewMute/, "Preview UI must expose a mute toggle");
          assert.match(js, /await musicElement\.play\(\)/, "Preview must start the selected music track");
          assert.match(js, /const soundEvents=\[\];let soundCursor=0/, "Final render must collect per-scene sound events");
          assert.match(js, /audioBuffer=audioContext\.createBuffer\(2,frameCount,sampleRate\)/, "Sound-only projects must still create an audio track");
          assert.match(app, /reveal را از بین none\/word\/char و sound را از بین none\/type\/impact\/whoosh\/sparkle/, "NAVI must be instructed to choose text reveal and sound effects");
          console.log("NAVI media flow, text reveal, procedural sound effects, preview and render wiring verified.");
          NODE

      - name: Ensure FFmpeg is available
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo timeout 600s apt-get update -qq
            sudo timeout 600s apt-get install -y --no-install-recommends ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version
          ffprobe -version

      - name: Download the photographic input
        run: |
          mkdir -p video-engine/image-motion-demo/assets
          curl --retry 3 --fail --location --silent --show-error \
            "https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=1600&h=2844&fit=crop&crop=entropy&auto=format&q=88" \
            -o video-engine/image-motion-demo/assets/landscape.jpg
          test -s video-engine/image-motion-demo/assets/landscape.jpg
          file video-engine/image-motion-demo/assets/landscape.jpg

      - name: Validate text composition
        working-directory: video-engine/demo
        run: npx --yes hyperframes@0.9.72 lint

      - name: Render text composition
        working-directory: video-engine/demo
        run: npx --yes hyperframes@0.9.72 render --output nava-first-render.mp4 --fps 30 --quality draft --workers 1

      - name: Validate image composition
        working-directory: video-engine/image-motion-demo
        run: npx --yes hyperframes@0.9.72 lint

      - name: Render image-to-motion composition
        working-directory: video-engine/image-motion-demo
        run: npx --yes hyperframes@0.9.72 render --output nava-image-motion.mp4 --fps 30 --quality draft --workers 1

      - name: Verify both MP4 outputs
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { execFileSync } from "node:child_process";
          const files = [
            ["video-engine/demo/nava-first-render.mp4", "text composition"],
            ["video-engine/image-motion-demo/nava-image-motion.mp4", "image motion composition"]
          ];
          for (const [path, label] of files) {
            const raw = execFileSync("ffprobe", [
              "-v", "error", "-select_streams", "v:0",
              "-show_entries", "stream=codec_name,width,height",
              "-show_entries", "format=duration", "-of", "json", path
            ], { encoding: "utf8" });
            const data = JSON.parse(raw);
            const stream = data.streams?.[0];
            const duration = Number(data.format?.duration);
            if (!stream || stream.codec_name !== "h264") throw new Error(label + ": expected H.264.");
            if (stream.width !== 1080 || stream.height !== 1920) throw new Error(label + ": unexpected dimensions.");
            if (!Number.isFinite(duration) || duration < 7.5 || duration > 8.5) throw new Error(label + ": unexpected duration " + duration);
            if (fs.statSync(path).size < 50000) throw new Error(label + ": output is unexpectedly small.");
            console.log("Validated " + label + ": H.264 1080x1920, " + duration.toFixed(2) + "s");
          }
          NODE

      - name: Upload rendered MP4s
        uses: actions/upload-artifact@v4
        with:
          name: nava-video-engine-smoke
          path: |
            video-engine/demo/nava-first-render.mp4
            video-engine/image-motion-demo/nava-image-motion.mp4
          if-no-files-found: error
          retention-days: 7
