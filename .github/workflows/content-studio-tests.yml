name: Content Studio intelligence tests

on:
  pull_request:
    branches: [main]
    paths:
      - "app.js"
      - "index.html"
      - "tests/content-studio-intelligence.test.mjs"
      - ".github/workflows/content-studio-tests.yml"
  push:
    branches: [main]
    paths:
      - "app.js"
      - "index.html"
      - "tests/content-studio-intelligence.test.mjs"
      - ".github/workflows/content-studio-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check regression test syntax
        run: node --check tests/content-studio-intelligence.test.mjs
      - name: Test adaptive Content Studio behavior
        run: node --test tests/content-studio-intelligence.test.mjs
