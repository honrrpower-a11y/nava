name: NAVI memory tests

on:
  push:
    branches:
      - navi-main-completion
    paths:
      - "modules/navi-memory.js"
      - "modules/shared.js"
      - "tests/navi-memory.test.mjs"
      - ".github/workflows/navi-memory-tests.yml"
  pull_request:
    branches:
      - navi-main-completion

jobs:
  navi-memory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run NAVI memory tests
        run: node --experimental-default-type=module --test tests/navi-memory.test.mjs
      - name: Check NAVI module syntax
        run: |
          node --experimental-default-type=module --check modules/navi-memory.js
          node --experimental-default-type=module --check modules/navi.js
