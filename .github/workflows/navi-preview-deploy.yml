name: NAVI isolated preview deploy

on:
  push:
    branches: [navi-completion-work]
    paths:
      - "index.js"
      - "modules/navi*.js"
      - "modules/shared.js"
      - "modules/config.js"
      - "wrangler.preview.jsonc"
      - "migrations/0001_navi_memory_schema.sql"
      - ".github/workflows/navi-preview-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: navi-completion-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: navi-completion-work
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify preview target
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('wrangler.preview.jsonc', 'utf8'));
          const db = config.d1_databases?.[0];
          if (config.name !== 'nava-music-api-preview' ||
              config.d1_databases?.length !== 1 ||
              db.binding !== 'NAVA_DB' ||
              db.database_name !== 'nava-memory-preview' ||
              db.database_id !== 'b48b0390-f292-4ecf-b36d-31eb2aff3958') {
            throw new Error('STOP: preview target mismatch; refusing deployment.');
          }
          if (!fs.existsSync('migrations/0001_navi_memory_schema.sql')) {
            throw new Error('STOP: preview migration is missing.');
          }
          console.log('Verified isolated preview Worker and D1 target.');
          NODE
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Apply migration to preview D1 only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler d1 execute nava-memory-preview --remote --file=migrations/0001_navi_memory_schema.sql --config=wrangler.preview.jsonc
      - name: Deploy preview Worker only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config=wrangler.preview.jsonc
