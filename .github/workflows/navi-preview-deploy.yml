name: NAVI preview deploy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY_PREVIEW_ONLY to migrate and deploy the isolated preview environment"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: navi-preview-deploy
  cancel-in-progress: false

jobs:
  deploy-preview:
    if: inputs.confirmation == 'DEPLOY_PREVIEW_ONLY'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: navi-main-completion

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Verify isolated preview configuration
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('wrangler.preview.jsonc', 'utf8'));
          if (config.name !== 'nava-music-api-preview') {
            throw new Error('STOP: preview Worker name does not match the approved name.');
          }
          if (!Array.isArray(config.d1_databases) || config.d1_databases.length !== 1) {
            throw new Error('STOP: expected exactly one D1 binding.');
          }
          const db = config.d1_databases[0];
          if (db.binding !== 'NAVA_DB' ||
              db.database_name !== 'nava-memory-preview' ||
              db.database_id !== 'b48b0390-f292-4ecf-b36d-31eb2aff3958') {
            throw new Error('STOP: D1 target is not the approved preview database.');
          }
          if (!fs.existsSync('migrations/0001_navi_memory_schema.sql')) {
            throw new Error('STOP: preview migration file is missing.');
          }
          console.log('Verified: nava-music-api-preview -> nava-memory-preview only.');
          NODE

      - name: Apply schema to preview D1 only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID secret" && exit 1)
          npx wrangler d1 execute nava-memory-preview --remote --file=migrations/0001_navi_memory_schema.sql --config=wrangler.preview.jsonc

      - name: Deploy preview Worker only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config=wrangler.preview.jsonc
