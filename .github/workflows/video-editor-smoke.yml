name: Video Editor Foundation Checks

on:
  pull_request:
    paths:
      - "video-editor.js"
      - "video-editor.css"
      - "video-studio.css"
      - "index.html"
      - ".github/workflows/video-editor-smoke.yml"

permissions:
  contents: read

jobs:
  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate editor JavaScript
        run: node --check video-editor.js
      - name: Verify editor wiring and local-only media workflow
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import assert from "node:assert/strict";
          const html = fs.readFileSync("index.html", "utf8");
          const js = fs.readFileSync("video-editor.js", "utf8");
          const css = fs.readFileSync("video-editor.css", "utf8");
          for (const id of ["navaVideoPanelVideo","navaEditorFiles","navaEditorAudio","navaEditorPreview","navaEditorTimeline","navaEditorPlay","navaEditorStop","navaEditorClear","navaEditorExport","navaEditorExportProgress","navaEditorExportOutput","navaEditorExportDownload"]) {
            assert.ok(html.includes('id="' + id + '"'), "Missing editor control: " + id);
            assert.ok(html.includes('id="navaEditorAudioPlayer"'), "Missing audio player element");
            assert.ok(js.includes('$("' + id + '")') || id === "navaVideoPanelVideo", "Editor script does not bind: " + id);
          }
          assert.match(html, /video-editor\.js\?v=[^"\\s]+/, "Editor script must be cache-versioned");
          assert.match(html, /video-editor\.css\?v=[^"\\s]+/, "Editor stylesheet must be cache-versioned");
          assert.match(js, /URL\.createObjectURL/, "Media must be handled locally in the browser");
          assert.match(js, /data-trim/, "Per-clip trim controls must be wired");
          assert.match(js, /addEventListener\("input"/, "Trim sliders must update live while dragging");
          assert.match(html, /nava-editor-steps/, "Guided editor workflow must be visible");
          assert.match(js, /data-action="up"/, "Clip ordering controls must be available");
          assert.match(js, /audio\.volume/, "Music volume control must be wired");
          assert.match(js, /VideoSampleSink/, "Source video must be decoded frame by frame");
          assert.match(js, /VideoSampleSource/, "Final video must use the offline encoder pipeline");
          assert.match(js, /OfflineAudioContext/, "Clip audio and music must be mixed offline");
          assert.match(js, /data-action="split"/, "Clip split action must be available");
          assert.match(js, /data-action="duplicate"/, "Clip duplicate action must be available");
          for (const id of ["navaEditorDeleteRangeStart","navaEditorDeleteRangeEnd","navaEditorDeleteRange"]) {
            assert.ok(html.includes('id="' + id + '"'), "Missing delete-range control: " + id);
          }
          assert.match(js, /deleteRangeButton\?\.addEventListener\("click"/, "Delete-range action must be wired");
          assert.match(js, /beforeDuration\\s*>=\\s*0\\.15/, "Delete-range must preserve the clip before the removed interval");
          assert.match(js, /afterDuration\\s*>=\\s*0\\.15/, "Delete-range must preserve the clip after the removed interval");
          assert.match(js, /window\.confirm\(/, "Delete-range must require confirmation before changing the edit");
          assert.match(js, /URL\.revokeObjectURL\(oldUrl\)/, "Delete-range must release the replaced clip URL");
          assert.match(js, /data-clip-volume/, "Per-clip original audio volume must be available");
          assert.match(js, /muteAudio/, "Per-clip original audio mute must be supported");
          assert.match(js, /navaEditorAspectRatio/, "Export aspect ratio must be selectable");
          assert.match(js, /exportDownload\.href/, "Final video download link must be created");
          assert.match(html, /ساخت و دانلود ویدیوی نهایی/, "Final render button must be visible");
          assert.match(css, /@media\(max-width:680px\)/, "Mobile editor layout must be present");
          assert.doesNotMatch(js, /fetch\(|XMLHttpRequest|NAVI_BASE/, "Editor must not upload media or call an API");
          console.log("Video editor foundation checks passed.");
          NODE