name: NAVA business tools tests

on:
  push:
    branches: [main]
    paths:
      - "business-tools.js"
      - "business-workspace.js"
      - "business-transactions-ui.js"
      - "business-financial-export.js"
      - "business-tabs.js"
      - "modules/business-transactions.js"
      - "modules/business.js"
      - "migrations/navi-production-reconcile/0004_nava_business_foundation.sql"
      - "migrations/navi-production-reconcile/0005_business_transactions_toman.sql"
      - "tests/business-api.test.mjs"
      - "business-tools.css"
      - "index.html"
      - "tests/business-tools.test.mjs"
      - ".github/workflows/business-tools-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "business-tools.js"
      - "business-tools.css"
      - "index.html"
      - "tests/business-tools.test.mjs"
      - ".github/workflows/business-tools-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  business-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check business tool JavaScript syntax
        run: node --check business-tools.js
      - name: Check business workspace and API JavaScript syntax
        run: |
          node --check business-workspace.js
          node --check business-transactions-ui.js
          node --check business-financial-export.js
          node --check business-tabs.js
          node --check modules/business-transactions.js
          node --check modules/business.js
      - name: Run business calculator and API validation tests
        run: node --test tests/business-tools.test.mjs tests/business-api.test.mjs
