name: NAVA business tools tests

on:
  push:
    branches: [main]
    paths:
      - "business-tools.js"
      - "business-workspace.js"
      - "business-catalog-ui.js"
      - "nava-dialogs.js"
      - "app.js"
      - "business-transactions-ui.js"
      - "business-payments-ui.js"
      - "business-financial-export.js"
      - "business-tabs.js"
      - "business-crm-ui.js"
      - "modules/business-crm.js"
      - "modules/business-payments.js"
      - "migrations/navi-production-reconcile/0009_business_customers_orders.sql"
      - "migrations/navi-production-reconcile/0010_business_customer_accounts.sql"
      - "modules/business-transactions.js"
      - "business-inventory-ui.js"
      - "modules/business-inventory.js"
      - "migrations/navi-production-reconcile/0008_business_inventory.sql"
      - "modules/business.js"
      - "tests/navi-context-security.test.mjs"
      - "migrations/navi-production-reconcile/0004_nava_business_foundation.sql"
      - "migrations/navi-production-reconcile/0005_business_transactions_toman.sql"
      - "migrations/navi-production-reconcile/0006_business_catalog.sql"
      - "migrations/navi-production-reconcile/0007_business_sales_catalog_link.sql"
      - "tests/business-api.test.mjs"
      - "business-tools.css"
      - "index.html"
      - "tests/business-tools.test.mjs"
      - ".github/workflows/business-tools-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "business-tools.js"
      - "business-tools.css"
      - "index.html"
      - "tests/business-tools.test.mjs"
      - ".github/workflows/business-tools-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  business-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check business tool JavaScript syntax
        run: node --check business-tools.js
      - name: Check business workspace and API JavaScript syntax
        run: |
          node --check business-workspace.js
          node --check business-catalog-ui.js
          node --check nava-dialogs.js
          node --check app.js
          node --check business-transactions-ui.js
          node --check business-payments-ui.js
          node --check business-financial-export.js
          node --check business-tabs.js
          node --check business-crm-ui.js
          node --check modules/business-crm.js
          node --check modules/business-payments.js
          node --check modules/business-transactions.js
          node --check modules/business-inventory.js
          node --check business-inventory-ui.js
          node --check modules/business.js
          node --check modules/navi.js
      - name: Run business calculator and API validation tests
        run: node --test tests/business-tools.test.mjs tests/business-api.test.mjs tests/navi-context-security.test.mjs
