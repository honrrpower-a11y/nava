name: NAVI Gemini provider resilience tests

on:
  push:
    branches: [main]
    paths:
      - "modules/navi.js"
      - "modules/config.js"
      - "tests/navi-gemini-retry.test.mjs"
      - ".github/workflows/navi-gemini-resilience-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "modules/navi.js"
      - "modules/config.js"
      - "tests/navi-gemini-retry.test.mjs"
      - ".github/workflows/navi-gemini-resilience-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check NAVI Worker syntax
        run: node --experimental-default-type=module --check modules/navi.js
      - name: Test Gemini retry and model failover
        run: node --experimental-default-type=module --test tests/navi-gemini-retry.test.mjs
