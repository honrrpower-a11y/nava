name: NAVI production Worker deploy

on:
  push:
    branches:
      - main
    paths:
      - "modules/navi.js"
      - "modules/navi-auth.js"
      - "modules/navi-memory.js"
      - "modules/shared.js"
      - "modules/config.js"
      - "index.js"
      - "wrangler.jsonc"
      - ".github/workflows/navi-production-deploy.yml"
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY_NAVA_MUSIC_API to deploy the production Worker. No D1 migrations are run."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: navi-production-worker-deploy
  cancel-in-progress: false

jobs:
  deploy-production-worker:
    if: github.event_name == 'push' || inputs.confirmation == 'DEPLOY_NAVA_MUSIC_API'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Verify production Worker and D1 targets
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const norm = value => String(value ?? '').trim().toLowerCase();

          if (norm(config.name) !== 'nava-music-api') {
            throw new Error('STOP: production Worker name mismatch.');
          }
          if (norm(config.main) !== './index.js') {
            throw new Error('STOP: unexpected Worker entry point.');
          }
          if (!Array.isArray(config.d1_databases) || config.d1_databases.length !== 1) {
            throw new Error('STOP: expected exactly one production D1 binding.');
          }

          const prod = config.d1_databases[0];
          const actual = {
            binding: norm(prod.binding),
            database_name: norm(prod.database_name),
            database_id: norm(prod.database_id)
          };
          const expected = {
            binding: 'nava_db',
            database_name: 'nava-memory',
            database_id: '56f30fed-a03b-4e36-a320-cbefd3feaf12'
          };
          for (const key of Object.keys(expected)) {
            if (actual[key] !== expected[key]) {
              throw new Error('STOP: production D1 ' + key + ' mismatch. Expected ' + expected[key] + ', received ' + (actual[key] || '<missing>') + '.');
            }
          }

          const requiredFiles = [
            'index.js',
            'modules/navi.js',
            'modules/navi-auth.js',
            'modules/navi-memory.js',
            'modules/shared.js'
          ];
          for (const file of requiredFiles) {
            if (!fs.existsSync(file)) {
              throw new Error('STOP: required Worker source file is missing: ' + file);
            }
          }
          console.log('Verified production Worker nava-music-api and exact nava-memory D1 target. No database migrations will run.');
          NODE

      - name: Deploy production Worker only (no D1 migrations)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID secret" && exit 1)
          npx wrangler deploy --config=wrangler.jsonc
