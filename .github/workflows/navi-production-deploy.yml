name: NAVI production Worker deploy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY_NAVA_MUSIC_API to deploy the production Worker. No D1 migrations are run."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: navi-production-worker-deploy
  cancel-in-progress: false

jobs:
  deploy-production-worker:
    if: inputs.confirmation == 'DEPLOY_NAVA_MUSIC_API'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Verify production Worker and D1 targets
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          if (config.name !== 'nava-music-api') {
            throw new Error('STOP: production Worker name mismatch.');
          }
          if (config.main !== './index.js') {
            throw new Error('STOP: unexpected Worker entry point.');
          }
          if (!Array.isArray(config.d1_databases) || config.d1_databases.length !== 2) {
            throw new Error('STOP: expected exactly the production and preview D1 bindings.');
          }
          const prod = config.d1_databases.find(db => db.binding === 'NAVA_DB');
          const preview = config.d1_databases.find(db => db.binding === 'NAVI_PREVIEW_DB');
          if (!prod || prod.database_name !== 'nava-memory' ||
              prod.database_id !== '56f30fed-a03b-4e36-a320-cbef3dfeaf12') {
            throw new Error('STOP: production D1 target mismatch.');
          }
          if (!preview || preview.database_name !== 'nava-memory-preview' ||
              preview.database_id !== 'b48b0390-f292-4ecf-b36d-31eb2aff3958') {
            throw new Error('STOP: preview D1 target mismatch.');
          }
          if (!fs.existsSync('index.js') || !fs.existsSync('modules/navi-memory.js')) {
            throw new Error('STOP: required Worker source files are missing.');
          }
          console.log('Verified production Worker and both D1 bindings. No database migrations will run.');
          NODE

      - name: Deploy production Worker only (no D1 migrations)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID secret" && exit 1)
          npx wrangler deploy --config=wrangler.jsonc
