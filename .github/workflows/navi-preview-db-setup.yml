name: NAVI preview database setup

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type PREVIEW_DB_ONLY to create the NAVI schema in the isolated preview database"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: navi-preview-db-setup
  cancel-in-progress: false

jobs:
  setup-preview-db:
    if: inputs.confirmation == 'PREVIEW_DB_ONLY'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Verify D1 targets before any remote command
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          if (config.name !== 'nava-music-api') throw new Error('Wrong Worker configuration.');
          const dbs = config.d1_databases || [];
          const production = dbs.find(x => x.binding === 'NAVA_DB');
          const preview = dbs.find(x => x.binding === 'NAVI_PREVIEW_DB');
          if (!production || production.database_name !== 'nava-memory' ||
              production.database_id !== '56f30fed-a03b-4e36-a320-cbef3dfeaf12') {
            throw new Error('Production binding mismatch; stopping.');
          }
          if (!preview || preview.database_name !== 'nava-memory-preview' ||
              preview.database_id !== 'b48b0390-f292-4ecf-b36d-31eb2aff3958') {
            throw new Error('Preview binding mismatch; stopping.');
          }
          if (!fs.existsSync('migrations/0001_navi_memory_schema.sql')) {
            throw new Error('NAVI schema migration missing; stopping.');
          }
          console.log('Verified exact preview database ID. Production database will not be targeted.');
          NODE

      - name: Apply additive schema to preview D1 only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID secret" && exit 1)
          npx wrangler d1 execute nava-memory-preview --remote --file=migrations/0001_navi_memory_schema.sql --config=wrangler.jsonc

      - name: Verify preview schema read-only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute nava-memory-preview --remote --command="SELECT name FROM sqlite_master WHERE type IN ('table','index') AND name LIKE 'navi_%' ORDER BY type, name;" --config=wrangler.jsonc
