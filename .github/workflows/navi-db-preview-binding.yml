name: NAVI database-only preview binding deploy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type ADD_NAVI_PREVIEW_DB_ONLY to add the isolated NAVI preview database binding to the existing Worker"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nava-production-worker-binding
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirmation == 'ADD_NAVI_PREVIEW_DB_ONLY'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Verify production and preview database bindings
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          if (config.name !== 'nava-music-api') throw new Error('Wrong Worker target.');
          const dbs = config.d1_databases || [];
          const production = dbs.find(x => x.binding === 'NAVA_DB');
          const preview = dbs.find(x => x.binding === 'NAVI_PREVIEW_DB');
          if (!production || production.database_name !== 'nava-memory' ||
              production.database_id !== '56f30fed-a03b-4e36-a320-cbef3dfeaf12') {
            throw new Error('Production D1 binding changed; stopping.');
          }
          if (!preview || preview.database_name !== 'nava-memory-preview' ||
              preview.database_id !== 'b48b0390-f292-4ecf-b36d-31eb2aff3958') {
            throw new Error('Preview D1 binding is not the approved isolated database.');
          }
          console.log('Verified: only an additional isolated NAVI_PREVIEW_DB binding.');
          NODE
          grep -q 'X-Navi-Database' index.js
          grep -q 'NAVI_PREVIEW_DB' index.js
          grep -q 'NAVI_DB_HEADER' app.js

      - name: Deploy existing Nava Worker with additive preview D1 binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          npx wrangler deploy --config=wrangler.jsonc
