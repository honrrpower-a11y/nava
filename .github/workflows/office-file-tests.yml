name: Office file extraction tests

on:
  push:
    branches: [main]
    paths:
      - "office-file-tools.js"
      - "office-structured-files.js"
      - "index.html"
      - "tests/office-ocr.test.mjs"
      - ".github/workflows/office-file-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "office-file-tools.js"
      - "index.html"
      - "tests/office-ocr.test.mjs"
      - ".github/workflows/office-file-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Office JavaScript syntax
        run: node --check office-file-tools.js && node --check office-structured-files.js
      - name: Run Office extraction and OCR regression tests
        run: node --test tests/office-ocr.test.mjs
