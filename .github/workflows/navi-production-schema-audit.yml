name: NAVI production schema and readiness audit

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/navi-production-schema-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: navi-production-schema-audit
  cancel-in-progress: false

jobs:
  inspect-production-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Export production D1 read-only snapshot
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler d1 export nava-memory --remote --output=/tmp/nava-memory-schema-audit.sql
          test -s /tmp/nava-memory-schema-audit.sql
      - name: Preflight and apply only the additive NAVI base indexes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sqlite3
          source = "/tmp/nava-memory-schema-audit.sql"
          conn = sqlite3.connect(":memory:")
          with open(source, "r", encoding="utf-8") as f:
              conn.executescript(f.read())
          tables = {r[0] for r in conn.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          required_tables = {"users", "navi_chat_threads_v1", "navi_chat_messages_v1", "navi_memory_facts_v1"}
          missing = sorted(required_tables - tables)
          if missing:
              raise SystemExit("STOP: required production tables are missing: " + ", ".join(missing))
          columns = {r[1] for r in conn.execute('PRAGMA table_info("users")')}
          required_columns = {"username", "password_hash", "role", "status"}
          missing = sorted(required_columns - columns)
          if missing:
              raise SystemExit("STOP: account columns are missing; do not run base migration: " + ", ".join(missing))
          indexes = {r[0] for r in conn.execute("SELECT name FROM sqlite_master WHERE type='index'")}
          if "idx_users_username_unique" not in indexes:
              raise SystemExit("STOP: unique username index is absent; do not apply migration 0001.")
          duplicate = conn.execute("SELECT username FROM users WHERE username IS NOT NULL AND username <> '' GROUP BY username HAVING COUNT(*) > 1 LIMIT 1").fetchone()
          if duplicate:
              raise SystemExit("STOP: duplicate usernames found.")
          owner = conn.execute("SELECT username, role, status FROM users WHERE id='owner' LIMIT 1").fetchone()
          if not owner or owner != ("owner", "owner", "active"):
              raise SystemExit("STOP: owner account preconditions are not satisfied.")
          print("Preflight PASS: existing tables, account columns, unique username index, and owner identity verified.")
          PY
          npx wrangler d1 migrations apply nava-memory --remote --to 0001_navi_memory_schema.sql

      - name: List production D1 migration status (read-only)
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations list nava-memory --remote | tee navi-production-migrations.txt
          test -s navi-production-migrations.txt
      - name: List production Worker secret names only
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler secret list --name nava-music-api --format json > /tmp/navi-worker-secrets.json
          test -s /tmp/navi-worker-secrets.json
      - name: Verify schema and NAVI login readiness without exposing data or secrets
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import sqlite3
          import sys

          source = "/tmp/nava-memory-schema-audit.sql"
          target = "/tmp/navi-production-schema.sqlite"
          with open(source, "r", encoding="utf-8") as f:
              conn = sqlite3.connect(target)
              conn.executescript(f.read())

          lines = []
          tables = conn.execute(
              "SELECT name, sql FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name"
          ).fetchall()
          for name, create_sql in tables:
              lines.append(f"TABLE: {name}")
              lines.append(create_sql or "")
              columns = conn.execute(f'PRAGMA table_info("{name}")').fetchall()
              for col in columns:
                  lines.append("COLUMN: " + " | ".join(str(x) for x in col))
              lines.append("")

          indexes = conn.execute(
              "SELECT name, tbl_name, sql FROM sqlite_master WHERE type='index' AND name NOT LIKE 'sqlite_%' ORDER BY name"
          ).fetchall()
          for name, table_name, create_sql in indexes:
              lines.append(f"INDEX: {name} ON {table_name}")
              lines.append(create_sql or "")

          with open("navi-production-schema.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(lines))

          user_columns = {
              row[1] for row in conn.execute('PRAGMA table_info("users")').fetchall()
          }
          required_columns = {"username", "password_hash", "role", "status"}
          missing_columns = sorted(required_columns - user_columns)
          if missing_columns:
              raise SystemExit("STOP: production users table is missing required account columns: " + ", ".join(missing_columns))

          required_tables = {
              "users", "navi_chat_threads_v1", "navi_chat_messages_v1",
              "navi_memory_facts_v1"
          }
          actual_tables = {row[0] for row in tables}
          missing_tables = sorted(required_tables - actual_tables)
          if missing_tables:
              raise SystemExit("STOP: production NAVI tables are missing: " + ", ".join(missing_tables))

          required_indexes = {
              "idx_navi_chat_threads_owner_updated",
              "idx_navi_chat_messages_thread_id",
              "idx_navi_memory_owner_status_updated",
              "idx_navi_memory_owner_key_status",
              "idx_navi_memory_owner_value_status",
              "idx_users_username_unique"
          }
          actual_indexes = {row[0] for row in indexes}
          missing_indexes = sorted(required_indexes - actual_indexes)
          if missing_indexes:
              raise SystemExit("STOP: production schema is missing required indexes: " + ", ".join(missing_indexes))

          duplicate_usernames = conn.execute(
              "SELECT username, COUNT(*) FROM users WHERE username IS NOT NULL AND username <> '' GROUP BY username HAVING COUNT(*) > 1 LIMIT 1"
          ).fetchone()
          if duplicate_usernames:
              raise SystemExit("STOP: duplicate usernames prevent safe unique-index validation.")

          owner = conn.execute(
              "SELECT id, username, role, status, password_hash FROM users WHERE id = 'owner' LIMIT 1"
          ).fetchone()
          if not owner:
              raise SystemExit("STOP: the production owner account row is missing.")
          if owner[2] != "owner" or owner[3] != "active" or owner[1] != "owner":
              raise SystemExit("STOP: the production owner account identity or status is not valid.")

          with open("/tmp/navi-worker-secrets.json", "r", encoding="utf-8") as f:
              secret_records = json.load(f)
          secret_names = {
              item.get("name")
              for item in secret_records
              if isinstance(item, dict) and isinstance(item.get("name"), str)
          }

          session_secret_present = "NAVI_SESSION_SECRET" in secret_names
          owner_password_hash_present = bool(owner[4])
          owner_password_fallback_present = "NAVI_OWNER_PASSWORD" in secret_names

          if not session_secret_present:
              raise SystemExit("STOP: production Worker is missing the NAVI_SESSION_SECRET secret.")
          if not owner_password_hash_present and not owner_password_fallback_present:
              raise SystemExit("STOP: owner login has neither a D1 password hash nor the legacy NAVI_OWNER_PASSWORD secret.")

          report = [
              "NAVI production readiness audit",
              "D1 users account columns: PASS",
              "NAVI core tables: PASS",
              "Required NAVI and username indexes: PASS",
              "Owner account row: present",
              "Owner role: owner",
              "Owner status: active",
              "Owner username: owner",
              "NAVI_SESSION_SECRET configured: yes",
              "Owner D1 password hash configured: " + ("yes" if owner_password_hash_present else "no"),
              "Legacy NAVI_OWNER_PASSWORD fallback configured: " + ("yes" if owner_password_fallback_present else "no"),
              "Secret values: never read or written to this report"
          ]
          with open("navi-production-readiness.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(report) + "\n")

          print("\n".join(report))
          conn.close()
          PY
          rm -f /tmp/nava-memory-schema-audit.sql /tmp/navi-production-schema.sqlite /tmp/navi-worker-secrets.json
      - name: Upload schema and readiness audit
        uses: actions/upload-artifact@v4
        with:
          name: navi-production-schema-and-readiness-audit
          path: |
            navi-production-schema.txt
            navi-production-readiness.txt
            navi-production-migrations.txt
          if-no-files-found: error
          retention-days: 7
