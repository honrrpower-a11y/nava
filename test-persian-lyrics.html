<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nava | آزمایش موتور هجابندی فارسی</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #101522;
      color: #edf1f8;
      font-family: Tahoma, Arial, sans-serif;
      line-height: 1.9;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      color: #f3c84b;
      font-size: 23px;
      margin-bottom: 5px;
    }

    h2 {
      color: #f3c84b;
      font-size: 18px;
      margin-top: 0;
    }

    .subtitle {
      color: #aab3c3;
      font-size: 13px;
      margin-bottom: 22px;
    }

    .panel {
      background: #1a2232;
      border: 1px solid #303c52;
      border-radius: 13px;
      padding: 18px;
      margin-bottom: 18px;
    }

    textarea,
    input {
      width: 100%;
      background: #101827;
      color: #fff;
      border: 1px solid #43516b;
      border-radius: 9px;
      padding: 12px;
      font-family: Tahoma, Arial, sans-serif;
      font-size: 15px;
      outline: none;
    }

    textarea:focus,
    input:focus {
      border-color: #e9bd42;
    }

    textarea {
      min-height: 190px;
      resize: vertical;
      line-height: 2;
    }

    button {
      border: none;
      border-radius: 9px;
      padding: 11px 17px;
      margin: 5px 3px;
      font-family: Tahoma, Arial, sans-serif;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #e8bd42;
      color: #171717;
    }

    .secondary {
      background: #34435c;
      color: #fff;
    }

    .success {
      background: #247b5a;
      color: #fff;
    }

    .danger {
      background: #873f48;
      color: #fff;
    }

    .word-card {
      background: #111a29;
      border: 1px solid #394861;
      border-radius: 10px;
      padding: 14px;
      margin: 12px 0;
    }

    .word {
      color: #f3c84b;
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .hint {
      color: #aab3c3;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .status {
      color: #aab3c3;
      font-size: 13px;
      margin: 10px 0;
    }

    .approved-word {
      display: inline-block;
      background: #263d39;
      color: #a5edc9;
      border-radius: 7px;
      padding: 5px 10px;
      margin: 4px;
      font-size: 13px;
    }

    .result {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      direction: ltr;
      text-align: left;
      background: #0b111c;
      color: #c7d5e9;
      border: 1px solid #303c52;
      border-radius: 9px;
      padding: 14px;
      font-size: 12px;
      max-height: 600px;
      overflow: auto;
    }

    .empty {
      color: #8fd8ad;
      padding: 12px;
    }

    .error {
      color: #ff9292;
      padding: 10px;
    }

    .counter {
      color: #aab3c3;
      font-size: 12px;
      margin-top: 5px;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      .panel {
        padding: 13px;
      }

      h1 {
        font-size: 20px;
      }

      button {
        width: 100%;
        margin: 5px 0;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>آزمایش موتور هجابندی فارسی Nava</h1>

  <div class="subtitle">
    Persian Lyrics Engine | Engine Version 0.3.1
  </div>

  <div class="panel">
    <h2>۱. متن آزمایشی</h2>

    <textarea id="lyricsInput" placeholder="شعر یا متن فارسی را اینجا وارد کن...">دلم گرفته از این شبای بی‌ستاره
چشام هنوز دنبال رد پات می‌باره
تو رفتی و بارون به شیشه می‌کوبه
صدای خنده‌هات هنوز تو گوشم می‌مونه
کجای این شهری که منو یادت نمیاد
دلم بدون تو دیگه آروم نمی‌گیره</textarea>

    <div class="counter" id="charCount">۰ کاراکتر</div>

    <button class="primary" id="runButton">
      اجرای آزمایش
    </button>

    <button class="secondary" id="clearButton">
      پاک کردن متن
    </button>

    <div id="runStatus" class="status"></div>
  </div>

  <div class="panel">
    <div class="section-title">
      <h2>۲. واژه‌های نیازمند بررسی</h2>
      <span id="unknownCount" class="status">۰ واژه</span>
    </div>

    <div id="unknownWords">
      <div class="status">
        ابتدا آزمایش را اجرا کن.
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="section-title">
      <h2>۳. واژه‌های تأییدشده</h2>

      <button class="secondary" id="refreshWordsButton">
        به‌روزرسانی فهرست
      </button>
    </div>

    <div id="approvedWords">
      در حال دریافت واژه‌ها...
    </div>

    <button class="success" id="downloadButton">
      دانلود واژه‌نامه JSON
    </button>
  </div>

  <div class="panel">
    <h2>۴. خروجی کامل موتور</h2>

    <div id="jsonOutput" class="result">
      هنوز آزمایشی اجرا نشده است.
    </div>

    <button class="secondary" id="copyOutputButton">
      کپی خروجی کامل
    </button>
  </div>

</div>

<script src="./persian-lyrics.js?v=033-text-input"></script>

<script>
  let lastOutput = null;

  const $ = (id) => document.getElementById(id);

  function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, function(char) {
      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char];
    });
  }

  function getWordValue(item) {
    if (typeof item === "string") return item;

    if (item && typeof item === "object") {
      return item.word || item.text || item.token || "";
    }

    return "";
  }

  function toPersianNumber(number) {
    return Number(number).toLocaleString("fa-IR");
  }

  function showApprovedWords() {
    const container = $("approvedWords");

    try {
      const words = getReviewedWords();

      if (!words || Object.keys(words).length === 0) {
        container.innerHTML =
          '<div class="status">هنوز واژه‌ای ذخیره نشده است.</div>';
        return;
      }

      let html = "";

      if (Array.isArray(words)) {
        words.forEach(item => {
          if (typeof item === "string") {
            html += `<span class="approved-word">${escapeHTML(item)}</span>`;
          } else {
            const word = getWordValue(item);
            const syllables = item.syllables || "";

            html += `
              <span class="approved-word">
                ${escapeHTML(word)}
                ${syllables ? " : " + escapeHTML(
                  Array.isArray(syllables)
                    ? syllables.join(" / ")
                    : syllables
                ) : ""}
              </span>`;
          }
        });
      } else {
        Object.entries(words).forEach(([word, syllables]) => {
          html += `
            <span class="approved-word">
              ${escapeHTML(word)}
              : ${escapeHTML(
                Array.isArray(syllables)
                  ? syllables.join(" / ")
                  : syllables
              )}
            </span>`;
        });
      }

      container.innerHTML = html || "واژه‌ای ثبت نشده است.";

    } catch (error) {
      container.innerHTML =
        '<div class="error">خطا در دریافت واژه‌نامه: ' +
        escapeHTML(error.message) + '</div>';
    }
  }

  function showUnknownWords(words) {
    const container = $("unknownWords");

    if (!Array.isArray(words) || words.length === 0) {
      $("unknownCount").textContent = "۰ واژه";

      container.innerHTML = `
        <div class="empty">
          هیچ واژه ناشناخته‌ای وجود ندارد.
        </div>`;
      return;
    }

    $("unknownCount").textContent =
      toPersianNumber(words.length) + " واژه";

    let html = "";

    words.forEach((item, index) => {
      const word = getWordValue(item);

      if (!word) return;

      html += `
        <div class="word-card">
          <div class="word">${escapeHTML(word)}</div>

          <div class="hint">
            هجابندی پیشنهادی خودت را وارد کن و سپس تأیید کن.
            <br>
            مثال: پَن جَ رِه
          </div>

          <input
            type="text"
            id="syllables-${index}"
            placeholder="مثلاً: پَن جَ رِه"
            value=""
          >

          <button
            class="success"
            onclick="approveWord(${index})">
            تأیید و ذخیره واژه
          </button>

          <div id="message-${index}" class="status"></div>
        </div>
      `;
    });

    container.innerHTML = html;
  }

  function runTest() {
    const input = $("lyricsInput").value.trim();

    if (!input) {
      $("runStatus").innerHTML =
        '<span class="error">ابتدا یک متن فارسی وارد کن.</span>';
      return;
    }

    if (typeof preparePersianLyrics !== "function") {
      $("runStatus").innerHTML =
        '<span class="error">فایل persian-lyrics.js بارگذاری نشده یا تابع موتور پیدا نشد.</span>';
      return;
    }

    try {
      $("runStatus").textContent = "در حال اجرای آزمایش...";

      const output = preparePersianLyrics(input);

      lastOutput = output;

      const unknownWords =
        output &&
        output.review_summary &&
        Array.isArray(output.review_summary.unknown_words)
          ? output.review_summary.unknown_words
          : [];

      showUnknownWords(unknownWords);

      $("jsonOutput").textContent =
        JSON.stringify(output, null, 2);

      $("runStatus").innerHTML =
        '<span class="empty">آزمایش با موفقیت اجرا شد.</span>';

      showApprovedWords();

    } catch (error) {
      $("runStatus").innerHTML =
        '<span class="error">خطا در اجرای موتور: ' +
        escapeHTML(error.message) + '</span>';

      $("jsonOutput").textContent =
        error.stack || error.message;
    }
  }

  function approveWord(index) {
    const input = $("syllables-" + index);
    const message = $("message-" + index);

    if (!input || !input.value.trim()) {
      message.innerHTML =
        '<span class="error">هجابندی را وارد کن.</span>';
      return;
    }

    const unknownWords =
      lastOutput &&
      lastOutput.review_summary &&
      lastOutput.review_summary.unknown_words
        ? lastOutput.review_summary.unknown_words
        : [];

    const word = getWordValue(unknownWords[index]);
    const syllables = input.value.trim();

    if (!word) {
      message.innerHTML =
        '<span class="error">واژه پیدا نشد. دوباره آزمایش را اجرا کن.</span>';
      return;
    }

    try {
      const result = addReviewedWord(word, syllables);

      if (result === false) {
        message.innerHTML =
          '<span class="error">ذخیره واژه انجام نشد. هجابندی را بررسی کن.</span>';
        return;
      }

      message.innerHTML =
        '<span class="empty">واژه با موفقیت ذخیره شد.</span>';

      showApprovedWords();

    } catch (error) {
      message.innerHTML =
        '<span class="error">خطا در ذخیره: ' +
        escapeHTML(error.message) + '</span>';
    }
  }

  function downloadDictionary() {
    try {
      const dictionary = exportReviewedDictionary();

      const content =
        typeof dictionary === "string"
          ? dictionary
          : JSON.stringify(dictionary, null, 2);

      const blob = new Blob(
        [content],
        { type: "application/json;charset=utf-8" }
      );

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = "nava-persian-reviewed-words.json";

      document.body.appendChild(link);
      link.click();
      link.remove();

      URL.revokeObjectURL(url);

    } catch (error) {
      alert("خطا در دانلود واژه‌نامه: " + error.message);
    }
  }

  function copyOutput() {
    if (!lastOutput) {
      alert("ابتدا آزمایش را اجرا کن.");
      return;
    }

    const content = JSON.stringify(lastOutput, null, 2);

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(content)
        .then(() => alert("خروجی کپی شد."))
        .catch(() => fallbackCopy(content));
    } else {
      fallbackCopy(content);
    }
  }

  function fallbackCopy(content) {
    const area = document.createElement("textarea");
    area.value = content;

    document.body.appendChild(area);
    area.select();

    try {
      document.execCommand("copy");
      alert("خروجی کپی شد.");
    } catch (error) {
      alert("کپی خودکار ممکن نشد.");
    }

    area.remove();
  }

  $("runButton").addEventListener("click", runTest);

  $("clearButton").addEventListener("click", function() {
    $("lyricsInput").value = "";
    updateCharCount();
  });

  $("downloadButton").addEventListener("click", downloadDictionary);

  $("refreshWordsButton").addEventListener(
    "click",
    showApprovedWords
  );

  $("copyOutputButton").addEventListener("click", copyOutput);

  function updateCharCount() {
    $("charCount").textContent =
      toPersianNumber($("lyricsInput").value.length) +
      " کاراکتر";
  }

  $("lyricsInput").addEventListener(
    "input",
    updateCharCount
  );

  updateCharCount();
  showApprovedWords();
</script>

</body>
</html>
