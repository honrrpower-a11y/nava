<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پلتفرم نوا | Nava Studio</title>
    <!-- استفاده از فونت Vazirmatn -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            /* پلت رنگ‌های گرم (پیش‌فرض) */
            --bg-color: #FFF8F0;
            --card-bg: #FFFFFF;
            --text-main: #2B2D42;
            --text-sub: #6C757D;
            --primary-orange: #FB8500;
            --primary-gold: #FFB703;
            --accent-purple: #7209B7;
            --border-color: #FFE5D9;
            --shadow-color: rgba(251, 133, 0, 0.15);
        }

        [data-theme="dark"] {
            /* پلت نایت‌مود (تاریک و شیک) */
            --bg-color: #0D1B2A;
            --card-bg: #1B263B;
            --text-main: #F8F9FA;
            --text-sub: #ADB5BD;
            --primary-orange: #FFB703;
            --primary-gold: #FB8500;
            --accent-purple: #F72585;
            --border-color: #415A77;
            --shadow-color: rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px var(--shadow-color);
            border: 1px solid var(--border-color);
        }

        /* هدر و دکمه نایت مود */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--primary-orange);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .theme-toggle-btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 50px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: bold;
        }

        /* دکمه‌های تب‌بندی */
        .tabs {
            display: flex;
            gap: 10px;
            background-color: var(--bg-color);
            padding: 6px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            color: var(--text-sub);
            font-family: inherit;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        .tab-btn.active {
            background-color: var(--card-bg);
            color: var(--primary-orange);
            box-shadow: 0 2px 8px var(--shadow-color);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* استایل فرم‌ها */
        textarea, input, select {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.95rem;
            margin-top: 8px;
            margin-bottom: 18px;
            outline: none;
        }

        textarea:focus, input:focus {
            border-color: var(--primary-orange);
        }

        label {
            font-weight: bold;
            font-size: 0.9rem;
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary-gold), var(--primary-orange));
            color: #FFFFFF;
            font-family: inherit;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--shadow-color);
        }

        /* کادر پیش‌نمایش کارت استوری */
        .story-preview-card {
            margin-top: 25px;
            padding: 30px 20px;
            border-radius: 16px;
            background: #111111; /* همیشه دارک برای حس استوری نئونی/مینیمال */
            color: #FFFFFF;
            text-align: center;
            border: 2px solid var(--primary-orange);
            position: relative;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .story-text {
            font-size: 1.2rem;
            line-height: 1.8;
            font-weight: bold;
        }

        .story-subtitle {
            margin-top: 15px;
            font-size: 0.85rem;
            color: var(--primary-gold);
            opacity: 0.8;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- هدر سایت -->
    <div class="header">
        <div class="logo">
            <span>🍊</span> استودیو نوا
        </div>
        <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeBtn">🌙 نایت‌مود</button>
    </div>

    <!-- دکمه‌های تب‌بندی -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('musicTab', this)">🎵 موزیک و صدا</button>
        <button class="tab-btn" onclick="switchTab('storyTab', this)">✨ استوری‌ساز مینیمال</button>
    </div>

    <!-- تب ۱: موزیک و صدا -->
    <div id="musicTab" class="tab-content active">
        <label for="lyrics">متن یا ترانه:</label>
        <textarea id="lyrics" rows="4" placeholder="متن ترانه یا ایده صوتی خود را اینجا بنویسید..."></textarea>

        <label for="style">سبک موسیقی:</label>
        <input type="text" id="style" placeholder="مثال: Persian Pop, Upbeat, Electro Beats">

        <button class="action-btn">ساخت قطعه صوتی 🚀</button>
    </div>

    <!-- تب ۲: استوری‌ساز مینیمال -->
    <div id="storyTab" class="tab-content">
        <label for="storyInput">متن دل‌نوشته یا جمله استوری:</label>
        <textarea id="storyInput" rows="3" placeholder="یک جمله کوتاه‌ها، حس‌وحال شبانه یا دل‌نوشته بنویسید..." oninput="updatePreview()"></textarea>

        <label for="storyStyle">لحن کارت:</label>
        <select id="storyStyle" onchange="updatePreview()">
            <option value="minimal">مینیمال و دارک</option>
            <option value="warm">گرم و عمیق</option>
            <option value="motivational">انگیزشی نئونی</option>
        </select>

        <button class="action-btn">پردازش و بازنویسی با هوش مصنوعی ✨</button>

        <!-- پیش‌نمایش زنده کارت استوری -->
        <div class="story-preview-card" id="storyPreview">
            <div class="story-text" id="previewText">متن شما اینجا قرار می‌گیرد...</div>
            <div class="story-subtitle" id="previewSub">@Nava_Studio</div>
        </div>
    </div>
</div>

<script>
    // تغییر تب‌ها
    function switchTab(tabId, element) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        element.classList.add('active');
    }

    // سوییچ بین تم گرم و نایت‌مود
    function toggleTheme() {
        const body = document.body;
        const btn = document.getElementById('themeBtn');
        
        if (body.getAttribute('data-theme') === 'dark') {
            body.removeAttribute('data-theme');
            btn.innerText = '🌙 نایت‌مود';
        } else {
            body.setAttribute('data-theme', 'dark');
            btn.innerText = '☀️ تم گرم';
        }
    }

    // آپدیت زنده پیش‌نمایش کارت استوری
    function updatePreview() {
        const input = document.getElementById('storyInput').value;
        const previewText = document.getElementById('previewText');
        
        if (input.trim() !== '') {
            previewText.innerText = `« ${input} »`;
        } else {
            previewText.innerText = 'متن شما اینجا قرار می‌گیرد...';
        }
    }
</script>

</body>
</html>
