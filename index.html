<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استودیو نوا | Nava Studio</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --bg-deep: #090A0F;
            --card-bg: rgba(19, 23, 34, 0.8);
            --text-main: #FFFFFF;
            --text-sub: #94A3B8;
            --accent-purple: #8B5CF6;
            --accent-pink: #EC4899;
            --border-glass: rgba(255, 255, 255, 0.08);
            --glow-main: rgba(139, 92, 246, 0.35);
        }

        * {
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(236, 72, 153, 0.12) 0%, transparent 40%);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background-color: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 32px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-glass);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 900;
            background: linear-gradient(135deg, #A78BFA 0%, #F472B6 50%, #38BDF8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tabs {
            display: flex;
            gap: 8px;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px;
            border-radius: 16px;
            margin-bottom: 25px;
            border: 1px solid var(--border-glass);
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            color: var(--text-sub);
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.3), rgba(236, 72, 153, 0.2));
            color: #FFFFFF;
            border: 1px solid rgba(139, 92, 246, 0.4);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.2);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        textarea, input, select {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid var(--border-glass);
            background-color: rgba(0, 0, 0, 0.25);
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.95rem;
            margin-top: 6px;
            margin-bottom: 16px;
            outline: none;
        }

        textarea:focus, input:focus, select:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 15px var(--glow-main);
        }

        label {
            font-weight: bold;
            font-size: 0.9rem;
            color: var(--text-sub);
        }

        .row-group {
            display: flex;
            gap: 15px;
        }

        .row-group > div {
            flex: 1;
        }

        .action-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #8B5CF6 0%, #EC4899 100%);
            color: #FFFFFF;
            font-family: inherit;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.4);
            margin-top: 10px;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(236, 72, 153, 0.5);
        }

        .story-preview-card {
            margin-top: 25px;
            padding: 35px 20px;
            border-radius: 20px;
            background: linear-gradient(145deg, #0f172a, #1e1b4b);
            color: #FFFFFF;
            text-align: center;
            border: 1px solid rgba(139, 92, 246, 0.3);
            min-height: 210px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .story-text {
            font-size: 1.25rem;
            line-height: 1.8;
            font-weight: bold;
        }

        .story-subtitle {
            margin-top: 18px;
            font-size: 0.85rem;
            background: linear-gradient(135deg, #A78BFA, #F472B6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo">✨ استودیو نوا</div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('musicTab', this)">🎵 موزیک و صدا</button>
        <button class="tab-btn" onclick="switchTab('storyTab', this)">⚡ استوری‌ساز مینیمال</button>
    </div>

    <!-- تب ۱: موزیک و صدا (با تمام امکانات و تنظیمات کامل) -->
    <div id="musicTab" class="tab-content active">
        <label for="lyrics">متن ترانه یا ایده صوتی:</label>
        <textarea id="lyrics" rows="3" placeholder="متن ترانه یا توصیف فضای صوتی..."></textarea>

        <label for="style">سبک موسیقی:</label>
        <input type="text" id="style" placeholder="مثال: Cinematic Ambient, Lo-Fi Beat, Synthwave">

        <div class="row-group">
            <div>
                <label for="tempo">سرعت (Tempo):</label>
                <select id="tempo">
                    <option value="normal">معمولی / ملایم</option>
                    <option value="upbeat">پرانرژی و ریتمیک</option>
                    <option value="slow">کند و احساسی</option>
                </select>
            </div>
            <div>
                <label for="vocal">نوع خروجی:</label>
                <select id="vocal">
                    <option value="instrumental">بی‌کلام (Instrumental)</option>
                    <option value="withVocals">باکلام / آوایی</option>
                </select>
            </div>
        </div>

        <button class="action-btn">ساخت و پردازش قطعه صوتی 🎧</button>
    </div>

    <!-- تب ۲: استوری‌ساز مینیمال -->
    <div id="storyTab" class="tab-content">
        <label for="storyInput">متن دل‌نوشته یا استوری:</label>
        <textarea id="storyInput" rows="3" placeholder="یک جمله کوتاه یا حس‌وحال شبانه..." oninput="updatePreview()"></textarea>

        <label for="storyStyle">فضای کارت:</label>
        <select id="storyStyle">
            <option value="minimal">دارک و کهکشانی</option>
            <option value="deep">عمیق و نئونی</option>
        </select>

        <button class="action-btn">بازنویسی هوشمند متن ✨</button>

        <div class="story-preview-card">
            <div class="story-text" id="previewText">« متن شما اینجا قرار می‌گیرد... »</div>
            <div class="story-subtitle">@Nava_Studio</div>
        </div>
    </div>
</div>

<script>
    function switchTab(tabId, element) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        element.classList.add('active');
    }

    function updatePreview() {
        const input = document.getElementById('storyInput').value;
        const previewText = document.getElementById('previewText');
        
        if (input.trim() !== '') {
            previewText.innerText = `« ${input} »`;
        } else {
            previewText.innerText = '« متن شما اینجا قرار می‌گیرد... »';
        }
    }
</script>

</body>
</html>
