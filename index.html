<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پلتفرم نوا | Nava Studio</title>
    <!-- استفاده از فونت Vazirmatn -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            /* استایل الهام‌گرفته از فضای موزیکال و مدرن (پایه دارکِ شیک) */
            --bg-color: #0B0F19;          /* سورمه‌ای بسیار تیره و عمیق (پس‌زمینه اصلی) */
            --card-bg: #131B2E;           /* سورمه‌ای ملایم‌تر برای کارت‌ها */
            --text-main: #F8FAFC;         /* سفید یخی برای خوانایی عالی */
            --text-sub: #94A3B8;          /* خاکستری ملایم برای متن‌های فرعی */
            
            /* گرادینت‌ها و رنگ‌های نئونی و پرانرژی */
            --primary-gradient: linear-gradient(135deg, #8B5CF6 0%, #EC4899 100%); /* بنفش به سرخابی */
            --primary-color: #8B5CF6;     /* بنفش نئونی اصلی */
            --accent-glow: rgba(139, 92, 246, 0.25); /* نور پس‌زمینه */
            
            --border-color: #1E293B;      /* خطوط حاشیه‌ی تیره و مدرن */
            --shadow-color: rgba(0, 0, 0, 0.5); 
        }

        [data-theme="light"] {
            /* حالتِ روشن (در صورت نیاز به سوییچ) */
            --bg-color: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-main: #0F172A;
            --text-sub: #64748B;
            --primary-gradient: linear-gradient(135deg, #7C3AED 0%, #DB2777 100%);
            --primary-color: #7C3AED;
            --accent-glow: rgba(124, 58, 237, 0.15);
            --border-color: #E2E8F0;
            --shadow-color: rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 40px var(--shadow-color);
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        /* هدر و دکمه سوییچ تم */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 900;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .theme-toggle-btn {
            background: var(--border-color);
            border: none;
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 50px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .theme-toggle-btn:hover {
            opacity: 0.8;
        }

        /* دکمه‌های تب‌بندی */
        .tabs {
            display: flex;
            gap: 8px;
            background-color: var(--bg-color);
            padding: 6px;
            border-radius: 14px;
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            color: var(--text-sub);
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
        }

        .tab-btn.active {
            background: var(--primary-gradient);
            color: #FFFFFF;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* استایل فرم‌ها */
        textarea, input, select {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.95rem;
            margin-top: 8px;
            margin-bottom: 18px;
            outline: none;
        }

        textarea:focus, input:focus, select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        label {
            font-weight: bold;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: var(--primary-gradient);
            color: #FFFFFF;
            font-family: inherit;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        .action-btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        /* کادر پیش‌نمایش کارت استوری نئونی */
        .story-preview-card {
            margin-top: 25px;
            padding: 35px 20px;
            border-radius: 18px;
            background: linear-gradient(145deg, #0f172a, #1e1b4b);
            color: #FFFFFF;
            text-align: center;
            border: 1px solid rgba(139, 92, 246, 0.4);
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.15);
            position: relative;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .story-text {
            font-size: 1.25rem;
            line-height: 1.8;
            font-weight: bold;
        }

        .story-subtitle {
            margin-top: 20px;
            font-size: 0.85rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- هدر سایت -->
    <div class="header">
        <div class="logo">
            <span>🎛️</span> استودیو نوا
        </div>
        <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeBtn">☀️ حالت روشن</button>
    </div>

    <!-- دکمه‌های تب‌بندی -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('musicTab', this)">🎵 موزیک و صدا</button>
        <button class="tab-btn" onclick="switchTab('storyTab', this)">✨ استوری‌ساز مینیمال</button>
    </div>

    <!-- تب ۱: موزیک و صدا -->
    <div id="musicTab" class="tab-content active">
        <label for="lyrics">متن یا ترانه:</label>
        <textarea id="lyrics" rows="4" placeholder="متن ترانه یا ایده صوتی خود را اینجا بنویسید..."></textarea>

        <label for="style">سبک موسیقی:</label>
        <input type="text" id="style" placeholder="مثال: Persian Pop, Upbeat, Electro Beats">

        <button class="action-btn">ساخت قطعه صوتی 🚀</button>
    </div>

    <!-- تب ۲: استوری‌ساز مینیمال -->
    <div id="storyTab" class="tab-content">
        <label for="storyInput">متن دل‌نوشته یا جمله استوری:</label>
        <textarea id="storyInput" rows="3" placeholder="یک جمله کوتاه، حس‌وحال شبانه یا دل‌نوشته بنویسید..." oninput="updatePreview()"></textarea>

        <label for="storyStyle">لحن کارت:</label>
        <select id="storyStyle" onchange="updatePreview()">
            <option value="minimal">مینیمال و دارک</option>
            <option value="warm">موزیکال و عمیق</option>
            <option value="motivational">انگیزشی نئونی</option>
        </select>

        <button class="action-btn">پردازش و بازنویسی با هوش مصنوعی ✨</button>

        <!-- پیش‌نمایش زنده کارت استوری -->
        <div class="story-preview-card" id="storyPreview">
            <div class="story-text" id="previewText">« متن شما اینجا قرار می‌گیرد... »</div>
            <div class="story-subtitle" id="previewSub">@Nava_Studio</div>
        </div>
    </div>
</div>

<script>
    // تغییر تب‌ها
    function switchTab(tabId, element) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        element.classList.add('active');
    }

    // سوییچ بین تم دارکِ نئونی و حالت روشن
    function toggleTheme() {
        const html = document.documentElement;
        const btn = document.getElementById('themeBtn');
        
        if (html.getAttribute('data-theme') === 'light') {
            html.removeAttribute('data-theme');
            btn.innerText = '☀️ حالت روشن';
        } else {
            html.setAttribute('data-theme', 'light');
            btn.innerText = '🌙 نایت‌مود';
        }
    }

    // آپدیت زنده پیش‌نمایش کارت استوری
    function updatePreview() {
        const input = document.getElementById('storyInput').value;
        const previewText = document.getElementById('previewText');
        
        if (input.trim() !== '') {
            previewText.innerText = `« ${input} »`;
        } else {
            previewText.innerText = '« متن شما اینجا قرار می‌گیرد... »';
        }
    }
</script>

</body>
</html>
