<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استودیو نوا | Nava Studio</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --bg-deep: #090A0F;
            --card-bg: rgba(19, 23, 34, 0.75);
            --text-main: #FFFFFF;
            --text-sub: #94A3B8;
            --accent-purple: #8B5CF6;
            --accent-pink: #EC4899;
            --accent-cyan: #06B6D4;
            --border-glass: rgba(255, 255, 255, 0.08);
            --glow-main: rgba(139, 92, 246, 0.35);
        }

        * {
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(236, 72, 153, 0.12) 0%, transparent 40%);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 620px;
            background-color: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 32px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-glass);
            position: relative;
        }

        /* هدر */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 900;
            background: linear-gradient(135deg, #A78BFA 0%, #F472B6 50%, #38BDF8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.5px;
        }

        /* تب‌ها */
        .tabs {
            display: flex;
            gap: 8px;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px;
            border-radius: 16px;
            margin-bottom: 28px;
            border: 1px solid var(--border-glass);
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            color: var(--text-sub);
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.3), rgba(236, 72, 153, 0.2));
            color: #FFFFFF;
            border: 1px solid rgba(139, 92, 246, 0.4);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.2);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* اینپوت‌ها */
        textarea, input, select {
            width: 100%;
            padding: 15px;
            border-radius: 14px;
            border: 1px solid var(--border-glass);
            background-color: rgba(0, 0, 0, 0.25);
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.95rem;
            margin-top: 8px;
            margin-bottom: 20px;
            outline: none;
        }

        textarea:focus, input:focus, select:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 15px var(--glow-main);
            background-color: rgba(0, 0, 0, 0.4);
        }

        label {
            font-weight: bold;
            font-size: 0.9rem;
            color: var(--text-sub);
        }

        /* دکمه اصلی عملیات */
        .action-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #8B5CF6 0%, #EC4899 100%);
            color: #FFFFFF;
            font-family: inherit;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.4);
            position: relative;
            overflow: hidden;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(236, 72, 153, 0.5);
        }

        /* کارت پیش‌نمایش استوری */
        .story-preview-card {
            margin-top: 28px;
            padding: 40px 24px;
            border-radius: 20px;
            background: linear-gradient(145deg, #0f172a, #1e1b4b);
            color: #FFFFFF;
            text-align: center;
            border: 1px solid rgba(139, 92, 246, 0.3);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 25px rgba(139, 92, 246, 0.15);
            position: relative;
            min-height: 230px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .story-text {
            font-size: 1.3rem;
            line-height: 1.9;
            font-weight: bold;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .story-subtitle {
            margin-top: 22px;
            font-size: 0.85rem;
            background: linear-gradient(135deg, #A78BFA, #F472B6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: bold;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- هدر -->
    <div class="header">
        <div class="logo">
            <span>✨</span> نوا | Nava Studio
        </div>
    </div>

    <!-- تب‌ها -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('musicTab', this)">🎵 موزیک و صدا</button>
        <button class="tab-btn" onclick="switchTab('storyTab', this)">⚡ استوری‌ساز مینیمال</button>
    </div>

    <!-- تب ۱ -->
    <div id="musicTab" class="tab-content active">
        <label for="lyrics">متن یا ایده صوتی:</label>
        <textarea id="lyrics" rows="4" placeholder="متن ترانه یا ایده خود را بنویسید..."></textarea>

        <label for="style">سبک و فضا:</label>
        <input type="text" id="style" placeholder="مثال: Deep Ambient, Cinematic, Lo-Fi">

        <button class="action-btn">پردازش و خلق صوتی 🎧</button>
    </div>

    <!-- تب ۲ -->
    <div id="storyTab" class="tab-content">
        <label for="storyInput">متن دل‌نوشته یا استوری:</label>
        <textarea id="storyInput" rows="3" placeholder="جمله یا حس‌وحال خود را بنویسید..." oninput="updatePreview()"></textarea>

        <label for="storyStyle">فضای کارت:</label>
        <select id="storyStyle">
            <option value="minimal">دارک و کهکشانی</option>
            <option value="deep">عمیق و مبهم</option>
        </select>

        <button class="action-btn">بازنویسی هوشمند متن ✨</button>

        <!-- پیش‌نمایش -->
        <div class="story-preview-card">
            <div class="story-text" id="previewText">« متن شما اینجا قرار می‌گیرد... »</div>
            <div class="story-subtitle">@Nava_Studio</div>
        </div>
    </div>
</div>

<script>
    function switchTab(tabId, element) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        element.classList.add('active');
    }

    function updatePreview() {
        const input = document.getElementById('storyInput').value;
        const previewText = document.getElementById('previewText');
        
        if (input.trim() !== '') {
            previewText.innerText = `« ${input} »`;
        } else {
            previewText.innerText = '« متن شما اینجا قرار می‌گیرد... »';
        }
    }
</script>

</body>
</html>
